<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAT Prep — Progress</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%98%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
<script src="vendor/chart.umd.min.js"></script>
</head>
<body>

<div class="navbar">
  <div class="brand"><span class="dot">●</span> SAT Prep</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="test-setup.html">Practice Test</a>
    <a href="progress.html" class="active">Progress</a>
    <a href="formulas.html">Formulas &amp; Strategies</a>
  </nav>
</div>

<div class="container">
  <h2>Your Progress</h2>

  <div id="content">
    <div class="empty-state">Loading…</div>
  </div>
</div>

<script type="module">
import { watchAuth } from "./js/auth.js";
import { fetchAttempts, summarizeAttempts } from "./js/progress.js";

watchAuth((user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }
  load(user);
});

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}
function modeLabel(mode) {
  return { full: "Full Practice Test", section: "Section Practice", module: "Module Practice", quick10: "Quick 10", custom: "Custom Test" }[mode] || mode;
}

async function load(user) {
  const content = document.getElementById("content");
  const attempts = await fetchAttempts(user.uid);

  if (attempts.length === 0) {
    content.innerHTML = `
      <div class="card empty-state">
        <p>You haven't completed any practice tests yet.</p>
        <a href="test-setup.html" class="btn mt-16">Start your first test</a>
      </div>`;
    return;
  }

  const s = summarizeAttempts(attempts);

  content.innerHTML = `
    <div class="card">
      <div class="grid grid-4">
        <div class="stat-tile"><div class="num">${s.totalTests}</div><div class="label">Tests taken</div></div>
        <div class="stat-tile"><div class="num">${s.totalQuestions}</div><div class="label">Questions answered</div></div>
        <div class="stat-tile"><div class="num">${s.overallAccuracy}%</div><div class="label">Overall accuracy</div></div>
        <div class="stat-tile"><div class="num">${s.totalCorrect}</div><div class="label">Total correct</div></div>
      </div>
    </div>

    <div class="grid grid-2 mt-16">
      <div class="card">
        <div class="card-title">Accuracy Over Time</div>
        <canvas id="trendChart" height="220"></canvas>
      </div>
      <div class="card">
        <div class="card-title">Accuracy by Domain</div>
        <div id="domainBars" class="mt-16"></div>
      </div>
    </div>

    <div class="card mt-16">
      <div class="card-title">Focus Areas</div>
      <div class="card-sub">Skills with the lowest accuracy across your practice (min. 2 attempts)</div>
      <div id="weakList" class="mt-16"></div>
    </div>

    <div class="card mt-16">
      <div class="card-title">Test History</div>
      <div id="historyList" class="mt-16"></div>
    </div>
  `;

  const domainBars = document.getElementById("domainBars");
  s.byDomain
    .slice()
    .sort((a, b) => a.accuracy - b.accuracy)
    .forEach((d) => {
      const row = document.createElement("div");
      row.className = "bar-row";
      row.innerHTML = `
        <div class="bar-label">${escapeHtml(d.label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${d.accuracy}%"></div></div>
        <div class="bar-pct">${d.accuracy}%</div>
      `;
      domainBars.appendChild(row);
    });

  const weakList = document.getElementById("weakList");
  if (s.weakestSkills.length === 0) {
    weakList.innerHTML = `<p class="muted">Not enough data yet — complete a few more tests to see focus areas.</p>`;
  } else {
    s.weakestSkills.forEach((sk) => {
      const row = document.createElement("div");
      row.className = "bar-row";
      row.innerHTML = `
        <div class="bar-label">${escapeHtml(sk.label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${sk.accuracy}%; background: var(--danger);"></div></div>
        <div class="bar-pct">${sk.accuracy}%</div>
      `;
      weakList.appendChild(row);
    });
  }

  const historyList = document.getElementById("historyList");
  attempts.forEach((a) => {
    const row = document.createElement("a");
    row.href = `review.html?attempt=${a.id}`;
    row.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); text-decoration:none; color:inherit;";
    const dateStr = a.submittedAt ? new Date(a.submittedAt).toLocaleDateString() : "";
    row.innerHTML = `
      <div>
        <div style="font-weight:600;">${modeLabel(a.mode)}</div>
        <div class="muted" style="font-size:0.82rem;">${dateStr} &middot; ${a.subjects?.map((s) => (s === "rw" ? "Reading & Writing" : "Math")).join(" + ")}</div>
      </div>
      <div class="flex gap-12" style="align-items:center;">
        <span class="muted">${a.correct}/${a.total}</span>
        <strong>${a.percent}%</strong>
      </div>
    `;
    historyList.appendChild(row);
  });

  const ctx = document.getElementById("trendChart");
  new Chart(ctx, {
    type: "line",
    data: {
      labels: s.trend.map((t) => new Date(t.date).toLocaleDateString()),
      datasets: [
        {
          label: "Accuracy %",
          data: s.trend.map((t) => t.percent),
          borderColor: "#2955e0",
          backgroundColor: "rgba(41,85,224,0.1)",
          tension: 0.3,
          fill: true
        }
      ]
    },
    options: {
      scales: { y: { min: 0, max: 100 } },
      plugins: { legend: { display: false } }
    }
  });
}
</script>
</body>
</html>
